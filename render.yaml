services:
  - type: web
    name: poolvault
    runtime: node
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: poolvault-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
